<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <title>Solapur Municipal Corporation - GIS Dashboard</title>
        <!-- OpenLayers CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openlayers/6.15.1/ol.css">
        <!-- FontAwesome CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body, html { width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; overflow: hidden; }
            
            /* Top Header */
            header {
                height: 60px;
                background: linear-gradient(135deg, #1e3c72, #2a5298);
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 20px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.2);
                z-index: 1000;
            }
            .header-title { display: flex; align-items: center; gap: 12px; }
            .header-title i { font-size: 24px; color: #4facfe; }
            .header-title h1 { font-size: 18px; font-weight: 600; }
            .header-title p { font-size: 11px; opacity: 0.8; }
            
            .header-badges { display: flex; gap: 15px; align-items: center; }
            .badge { background: rgba(255,255,255,0.15); padding: 5px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
            .badge span.dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; display: inline-block; }

            /* Main Layout */
            .main-container { display: flex; height: calc(100vh - 60px); width: 100vw; position: relative; }

            /* Sidebar */
            aside {
                width: 320px;
                background: #ffffff;
                border-right: 1px solid #e0e0e0;
                display: flex;
                flex-direction: column;
                z-index: 10;
                box-shadow: 2px 0 5px rgba(0,0,0,0.05);
                transition: transform 0.3s ease;
            }
            .sidebar-search { padding: 15px; border-bottom: 1px solid #eee; }
            .sidebar-search input {
                width: 100%;
                padding: 8px 12px 8px 32px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 13px;
                background: #f8f9fa;
                outline: none;
            }
            .search-wrapper { position: relative; }
            .search-wrapper i { position: absolute; left: 10px; top: 10px; color: #888; font-size: 13px; }

            .layer-catalog { flex: 1; overflow-y: auto; padding: 15px; }
            .category-title { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 700; margin-bottom: 8px; margin-top: 15px; display: flex; justify-content: space-between; }
            .layer-item { background: #fafbfc; border: 1px solid #eef0f2; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
            .layer-item-header { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; }
            .layer-item-header label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
            .layer-controls { margin-top: 8px; padding-left: 22px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #666; }
            .layer-controls input[type="range"] { width: 120px; accent-color: #2a5298; }

            /* Map Container */
            #map { flex: 1; height: 100%; position: relative; background: #e5e3df; }

            /* Map Base Layer Switcher Control */
            .basemap-switcher {
                position: absolute;
                top: 15px;
                right: 15px;
                background: white;
                padding: 5px;
                border-radius: 6px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.2);
                display: flex;
                gap: 5px;
                z-index: 1000;
            }
            .basemap-btn {
                padding: 6px 12px;
                font-size: 12px;
                border: none;
                background: #f1f3f5;
                cursor: pointer;
                border-radius: 4px;
                font-weight: 500;
                transition: background 0.2s;
            }
            .basemap-btn.active { background: #2a5298; color: white; }

            /* Footer Status Bar */
            .status-bar {
                position: absolute;
                bottom: 0;
                left: 320px;
                right: 0;
                height: 25px;
                background: rgba(255, 255, 255, 0.9);
                border-top: 1px solid #ddd;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 15px;
                font-size: 11px;
                color: #555;
                z-index: 1000;
            }

            /* Popup styling */
            .ol-popup {
                position: absolute;
                background-color: white;
                box-shadow: 0 3px 14px rgba(0,0,0,0.2);
                padding: 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
                bottom: 12px;
                left: -50px;
                min-width: 200px;
            }
            .ol-popup-closer {
                text-decoration: none;
                position: absolute;
                top: 5px;
                right: 8px;
                color: #aaa;
                font-weight: bold;
            }
            .ol-popup-closer:after { content: "✖"; }
        </style>
    </head>
    <body>
        <header>
            <div class="header-title">
                <i class="fa-solid fa-map-location-dot"></i>
                <div>
                    <h1>Solapur Municipal Corporation</h1>
                    <p>Spatial GIS & Infrastructure Intelligence Dashboard</p>
                </div>
            </div>
            <div class="header-badges">
                <div class="badge"><span class="dot"></span> Live Feed: Active</div>
                <div class="badge"><i class="fa-solid fa-layer-group"></i> Layers: <span id="layer-count">3</span></div>
            </div>
        </header>

        <div class="main-container">
            <aside>
                <div class="sidebar-search">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="layer-search-input" placeholder="Search layers or attributes..." onkeyup="filterLayers()">
                    </div>
                </div>
                <div class="layer-catalog" id="layer-catalog-container">
                    <!-- Dynamic Layers will be injected here -->
                </div>
            </aside>

            <div id="map">
                <div class="basemap-switcher">
                    <button class="basemap-btn active" onclick="setBaseMap('osm')">OSM Standard</button>
                    <button class="basemap-btn" onclick="setBaseMap('carto')">Carto Light</button>
                    <button class="basemap-btn" onclick="setBaseMap('satellite')">Satellite</button>
                </div>
                
                <div id="popup" class="ol-popup">
                    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                    <div id="popup-content"></div>
                </div>
            </div>

            <div class="status-bar">
                <span>Solapur Municipal Corporation • GIS Cell © 2026</span>
                <span id="coordinates">Lat: 17.6599, Lon: 75.9064</span>
            </div>
        </div>

        <!-- OpenLayers JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/openlayers/6.15.1/ol.js"></script>
        <script>
            // Base Maps Definition
            const osmLayer = new ol.layer.Tile({
                source: new ol.source.OSM(),
                title: 'OSM Standard'
            });

            const cartoLayer = new ol.layer.Tile({
                source: new ol.source.XYZ({
                    url: 'https://{a-c}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                    attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
                }),
                title: 'Carto Light',
                visible: false
            });

            const satelliteLayer = new ol.layer.Tile({
                source: new ol.source.XYZ({
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                    attribution: 'Tiles &copy; Esri'
                }),
                title: 'Satellite',
                visible: false
            });

            // Sample Vector Layers (Replace with your actual GeoJSON/Vector layers)
            const wardsSource = new ol.source.Vector({
                url: 'https://raw.githubusercontent.com/openlayers/openlayers/main/examples/data/geojson/switzerland.geojson', // Replace with your GeoJSON URL or local path
                format: new ol.format.GeoJSON()
            });

            const wardsLayer = new ol.layer.Vector({
                source: wardsSource,
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({ color: '#e74c3c', width: 2 }),
                    fill: new ol.style.Fill({ color: 'rgba(231, 76, 60, 0.1)' })
                }),
                name: 'Solapur Wards (2026)',
                category: 'Administrative'
            });

            const roadsLayer = new ol.layer.Vector({
                source: new ol.source.Vector(),
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({ color: '#2980b9', width: 3 })
                }),
                name: 'Road Network',
                category: 'Transport & Safety'
            });

            const slumsLayer = new ol.layer.Vector({
                source: new ol.source.Vector(),
                style: new ol.style.Style({
                    stroke: new ol.style.Stroke({ color: '#d35400', width: 2 }),
                    fill: new ol.style.Fill({ color: 'rgba(211, 84, 0, 0.2)' })
                }),
                name: 'Slum Settlements',
                category: 'Utilities & Housing'
            });

            // Group Layers Registry
            const managedLayers = [
                { id: 'wards', layer: wardsLayer, category: 'Administrative', name: 'Solapur Wards (2026)' },
                { id: 'roads', layer: roadsLayer, category: 'Transport & Safety', name: 'Road Network' },
                { id: 'slums', layer: slumsLayer, category: 'Utilities & Housing', name: 'Slum Settlements' }
            ];

            // Initialize Map
            const map = new ol.Map({
                target: 'map',
                layers: [osmLayer, cartoLayer, satelliteLayer, wardsLayer, roadsLayer, slumsLayer],
                view: new ol.View({
                    center: ol.proj.fromLonLat([75.9064, 17.6599]),
                    zoom: 12
                })
            });

            // Populate Sidebar Layer Catalog dynamically
            function buildLayerCatalog() {
                const container = document.getElementById('layer-catalog-container');
                container.innerHTML = '';

                // Group by category
                const categories = {};
                managedLayers.forEach(item => {
                    if (!categories[item.category]) categories[item.category] = [];
                    categories[item.category].push(item);
                });

                for (const [catName, items] of Object.entries(categories)) {
                    let catDiv = document.createElement('div');
                    catDiv.innerHTML = `<div class="category-title">${catName} <span>${items.length} LAYER</span></div>`;
                    
                    items.forEach(item => {
                        let itemDiv = document.createElement('div');
                        itemDiv.className = 'layer-item';
                        itemDiv.setAttribute('data-name', item.name.toLowerCase());
                        itemDiv.innerHTML = `
                            <div class="layer-item-header">
                                <label>
                                    <input type="checkbox" checked onchange="toggleLayerVisibility('${item.id}', this.checked)">
                                    ${item.name}
                                </label>
                            </div>
                            <div class="layer-controls">
                                <span>Opacity: <span id="val-${item.id}">100</span>%</span>
                                <input type="range" min="0" max="100" value="100" oninput="changeLayerOpacity('${item.id}', this.value)">
                            </div>
                        `;
                        catDiv.appendChild(itemDiv);
                    });
                    container.appendChild(catDiv);
                }
                document.getElementById('layer-count').innerText = managedLayers.length;
            }

            // Layer Visibility Control Function
            function toggleLayerVisibility(id, isVisible) {
                const target = managedLayers.find(l => l.id === id);
                if (target) {
                    target.layer.setVisible(isVisible);
                }
            }

            // Layer Opacity Control Function
            function changeLayerOpacity(id, val) {
                const target = managedLayers.find(l => l.id === id);
                if (target) {
                    target.layer.setOpacity(val / 100);
                    document.getElementById(`val-${id}`).innerText = val;
                }
            }

            // Base Map Switcher
            function setBaseMap(type) {
                osmLayer.setVisible(type === 'osm');
                cartoLayer.setVisible(type === 'carto');
                satelliteLayer.setVisible(type === 'satellite');

                document.querySelectorAll('.basemap-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }

            // Search Filter Function
            function filterLayers() {
                let query = document.getElementById('layer-search-input').value.toLowerCase();
                let items = document.querySelectorAll('.layer-item');
                items.forEach(item => {
                    let name = item.getAttribute('data-name');
                    if (name.includes(query)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            // Coordinate Display on Mouse Move
            map.on('pointermove', function(evt) {
                let coord = ol.proj.toLonLat(evt.coordinate);
                document.getElementById('coordinates').innerText = `Lat: ${coord[1].toFixed(4)}, Lon: ${coord[0].toFixed(4)}`;
            });

            // Initialize catalog on load
            buildLayerCatalog();
        </script>
    </body>
</html>
